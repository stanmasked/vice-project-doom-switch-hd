name: Native Core CI

on:
  push:
  pull_request:

# Avoid accumulating obsolete CI runs on a heavily iterated research branch.
# Preserve independent runs for other PRs and workflows.
concurrency:
  # Push and pull_request events for the same head branch share one queue slot.
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  code-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Configure native core
        run: cmake -S native_core -B build/native_core -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ targets
        run: cmake --build build/native_core --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build/native_core --output-on-failure
      - name: Build and run complete Stage 1-1 session lifecycle test
        run: |
          set -euo pipefail
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -Igame_core tests/test_driving_stage_one_session.cpp \
            -o build/driving_stage_one_session_test
          build/driving_stage_one_session_test
          c++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \\
            -Igame_core tests/test_driving_route_witness.cpp \\
            -o build/driving_route_witness_test
          build/driving_route_witness_test
      - name: Configure, build, and run graphics-core tests
        run: |
          set -euo pipefail
          cmake -S graphics_core -B build/graphics_core -DCMAKE_BUILD_TYPE=Release
          cmake --build build/graphics_core --parallel 2
          ctest --test-dir build/graphics_core --output-on-failure
      - name: Run synthetic ROM tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test private RAM probe generator and CSV validator contracts
        run: |
          python tools/test_private_ram_probe_contract.py
          python tools/test_private_ram_probe_validate.py
      - name: Install Lua 5.4 for FCEUX capture mock
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Syntax-check generated private RAM probe with Lua
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          python tools/generate_private_ram_probe.py --output "$tmp/probe.lua" --frames 321
          luac5.4 -p "$tmp/probe.lua"
          echo "VPD_GENERATED_RAM_PROBE_LUA_SYNTAX_PASS frames=321"
      - name: Exercise FCEUX Lua capture with and without CPU clock
        run: |
          lua5.4 tests/test_fceux_capture.lua
          lua5.4 tests/test_fceux_capture.lua --no-clock
          lua5.4 tests/test_fceux_capture.lua --no-read
          lua5.4 tests/test_fceux_capture.lua --dense
          lua5.4 tests/test_fceux_windowed_capture.lua
          lua5.4 tests/test_fceux_storyboard.lua
          lua5.4 tests/test_private_fm2_terminal_callbacks.lua
          lua5.4 tests/test_private_e8de_instruction_callbacks.lua
          lua5.4 tests/test_private_ppuscroll_writer_pcs.lua
          lua5.4 tests/test_private_road_ppu_321.lua
          lua5.4 tests/test_private_fceux_frame_anchors.lua
          lua5.4 tests/test_private_late_ppu_routine.lua
          lua5.4 tests/test_private_ppumask_ab.lua
          lua5.4 tests/test_private_chr_bank_ab.lua
          lua5.4 tests/test_private_chr0_bank_ab.lua
      - name: Trace real FCEUX Lua execution hooks under synthetic emulator callbacks
        run: |
          lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_NOCLOCK=1 lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_SHORT=1 lua5.4 tests/test_fceux_dispatch.lua
      - name: Reject ROMs, PPU snapshots, original art exports and binaries
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '(^|/)(atlases/|reports/|private/|roms/|reference_captures/|chr_all_pages_overview\.png$)|\.(nes|fds|unf|unif|iso|chd|nro|bmp|bin|vpat|sav|state|zip|7z)$'; then
            echo 'Forbidden ROM, PPU memory capture, or binary artifact tracked' >&2
            exit 1
          fi
