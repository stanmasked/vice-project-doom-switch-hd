name: Native Core CI

on:
  push:
  pull_request:

jobs:
  python-regressions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python test dependencies
        run: python -m pip install 'Pillow>=10,<13'
      - name: Compile Python files
        run: python -m compileall -q tools tests
      - name: Stage 38-54 trace and mapper regression group
        id: early_regressions
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          python -m unittest discover -s tests -p 'test_dispatch_execution.py' -v
          python -m unittest discover -s tests -p 'test_prg_read_mapping.py' -v
          python -m unittest discover -s tests -p 'test_prg_capture_completeness.py' -v
          python -m unittest discover -s tests -p 'test_prg_read_ranges.py' -v
          python -m unittest discover -s tests -p 'test_joint_cpu_context_validation.py' -v
          } 2>&1 | tee stage38-54.log
      - name: Stage 55-60 instruction and integration regression group
        id: late_regressions
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          {
          python -m unittest discover -s tests -p 'test_6502_read_address.py' -v
          python -m unittest discover -s tests -p 'test_6502_prg_instruction_verification.py' -v
          python -m unittest discover -s tests -p 'test_verified_prg_read_correlation.py' -v
          python -m unittest discover -s tests -p 'test_prg_identity_gate.py' -v
          python -m unittest discover -s tests -p 'test_stage60_integration.py' -v
          } 2>&1 | tee stage55-60.log
      - name: Upload Python failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prg-python-regression-logs
          path: |
            stage38-54.log
            stage55-60.log
          if-no-files-found: warn
          retention-days: 7
      - name: Report Python regression failures after artifact upload
        if: always()
        shell: bash
        env:
          EARLY_OUTCOME: ${{ steps.early_regressions.outcome }}
          LATE_OUTCOME: ${{ steps.late_regressions.outcome }}
        run: |
          echo "Earlier group: $EARLY_OUTCOME"
          echo "Later group: $LATE_OUTCOME"
          test "$EARLY_OUTCOME" = success && test "$LATE_OUTCOME" = success
  code-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=10,<13'
      - name: Configure native core
        run: cmake -S native_core -B build/native_core -DCMAKE_BUILD_TYPE=Release
      - name: Build C++ targets
        run: cmake --build build/native_core --parallel 2
      - name: Run C++ tests
        run: ctest --test-dir build/native_core --output-on-failure
      - name: Run synthetic ROM tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate stage39 video/dispatcher correlation without original ROM
        run: python -m unittest discover -s tests -p 'test_video_trace_alignment.py' -v
      - name: Install Lua 5.4 for FCEUX capture mock
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Exercise FCEUX Lua capture with and without CPU clock
        run: |
          lua5.4 tests/test_fceux_capture.lua
          lua5.4 tests/test_fceux_capture.lua --no-clock
          lua5.4 tests/test_fceux_capture.lua --dense
      - name: Trace real FCEUX Lua execution hooks under synthetic emulator callbacks
        run: |
          lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_NOCLOCK=1 lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_SHORT=1 lua5.4 tests/test_fceux_dispatch.lua
      - name: Exercise stage41 pointer-read FCEUX mock and overflow guard
        run: lua5.4 tests/test_fceux_pointer_access.lua
      - name: Exercise stage45 same-session PRG and MMC3 callbacks
        run: lua5.4 tests/test_fceux_prg_reads.lua
      - name: Exercise stage49 joint PC/read/MMC3 callback mock
        run: lua5.4 tests/test_fceux_joint_exec_reads.lua
      - name: Test stage52 optional CPU context capture with synthetic callbacks
        run: lua5.4 tests/test_fceux_cpu_context.lua
      - name: Check stage53 one-session CPU register and PRG read mock
        run: lua5.4 tests/test_fceux_joint_cpu_context.lua
      - name: Confirm documented FCEUX register API in stage52 and stage53 mocks
        run: lua5.4 tests/test_fceux_register_api.lua
      - name: Reject incompatible FCEUX hook callback shapes in synthetic stage53 capture
        run: lua5.4 tests/test_fceux_callback_contract.lua
      - name: Reject ROMs, PPU snapshots, original art exports and binaries
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E -i '(^|/)(atlases/|reports/|private/|roms/|reference_captures/|chr_all_pages_overview\.png$)|\.(nes|fds|unf|unif|iso|chd|nro|bmp|bin|vpat|sav|state|zip|7z)$'; then
            echo 'Forbidden ROM, PPU memory capture, or binary artifact tracked' >&2
            exit 1
          fi
