      - name: Stage149 native CPU OAM register source and certificate guards
        run: python -m unittest discover -s tests -p 'test_fceux_stage149_native_vblank_oam.py' -v
      - name: Stage89 validated static screen hypotheses and explicit provenance
        run: python -m unittest discover -s tests -p 'test_ppu_capture_session.py' -v
      - name: Stage88 audited PPU reference-frame inventory regressions
        run: python -m unittest discover -s tests -p 'test_ppu_capture_session.py' -v
      - name: Stage79 full-session video integrity regressions
        run: python -m unittest discover -s tests -p 'test_ppu_capture_session.py' -v
      - name: Validate stage39 video/dispatcher correlation without original ROM
        run: python -m unittest discover -s tests -p 'test_video_trace_alignment.py' -v
      - name: Install Lua 5.4 for FCEUX capture mock
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Stage95 FCEUX raster symbol probe has no side effects
        run: lua5.4 tests/test_fceux_ppu_raster_capability_probe.lua
      - name: Exercise FCEUX Lua capture with and without CPU clock
        run: |
          lua5.4 tests/test_fceux_capture.lua
          lua5.4 tests/test_fceux_capture.lua --no-clock
          lua5.4 tests/test_fceux_capture.lua --dense
      - name: Trace real FCEUX Lua execution hooks under synthetic emulator callbacks
        run: |
          lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_NOCLOCK=1 lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_SHORT=1 lua5.4 tests/test_fceux_dispatch.lua
          VPD_MOCK_BAD_MMC3=1 lua5.4 tests/test_fceux_dispatch.lua
      - name: Exercise stage41 pointer-read FCEUX mock and overflow guard
        run: lua5.4 tests/test_fceux_pointer_access.lua
      - name: Exercise stage45 same-session PRG and MMC3 callbacks
        run: lua5.4 tests/test_fceux_prg_reads.lua
      - name: Exercise stage49 joint PC/read/MMC3 callback mock
        run: lua5.4 tests/test_fceux_joint_exec_reads.lua
      - name: Test stage52 optional CPU context capture with synthetic callbacks
