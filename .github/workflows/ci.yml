      - name: Stage135 native 8x16 OAM bank, pixel and forged witness tests
        run: python -m unittest discover -s tests -p 'test_fceux_stage135_native_sprite_8x16.py' -v
      - name: Stage136 eight-sprite OAM selection and overflow source/model regressions
