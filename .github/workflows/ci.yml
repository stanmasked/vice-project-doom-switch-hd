      - name: Stage144 correct mirrored 6502 JMP relocation and ROM byte integrity
        run: python -m unittest discover -s tests -p 'test_fceux_stage144_stable_frames.py' -v
      - name: Stage146 causal stable and stale JMP native witness regressions
        run: python -m unittest discover -s tests -p 'test_fceux_stage146_stale_jmp_causal.py' -v
      - name: Stage147 strict native raw-color and sprite-source checks
        run: python -m unittest discover -s tests -p 'test_fceux_stage147_native_frame_source.py' -v
      - name: Stage148 VBlank CPU OAM transition ROM and byte-exact controls
