name: GitHub Runner Smoke Test

on:
  pull_request:
  push:
    branches:
      - research/stage39-video-trace-alignment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm runner allocation
        run: |
          echo "Runner allocated successfully"
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Workflow: ${GITHUB_WORKFLOW}"
          echo "Runner OS: ${RUNNER_OS}"
          python3 --version
      - name: Confirm shell execution
        run: |
          echo "Stage87 smoke passed: Linux shell and Python available"
