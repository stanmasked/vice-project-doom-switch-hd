  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vice-nexium-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-guest:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Add toolchain
        run: |
          echo "$DEVKITPRO/devkitA64/bin" >> "$GITHUB_PATH"
          echo "$DEVKITPRO/portlibs/switch/bin" >> "$GITHUB_PATH"
      - name: Cross-build exact PR NRO for guest execution
        run: |
          make -C switch_graphical -j2
          python3 tests/check_nro.py switch_graphical/vpd_native_scene.nro
          sha256sum switch_graphical/vpd_native_scene.nro
      - uses: actions/upload-artifact@v4
        with:
          name: vice-nexium-guest-nro
          path: switch_graphical/vpd_native_scene.nro
          retention-days: 7
          if-no-files-found: error

  emulate:
    needs: build-guest
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vice-nexium-guest-nro
          path: emulator-input
      - name: Ensure headless Vulkan and display dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            xvfb xauth xdotool x11-apps imagemagick mesa-vulkan-drivers libvulkan1 vulkan-tools \
            libgtk-3-0 libasound2t64 libudev1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libx11-xcb1 libegl1 libgles2 libgl1 libpulse0
      - name: Validate launcher shell syntax
        run: |
          bash -n tools/run_nexium_vice_ci.sh
          bash -n tools/nexium_visual_probe.sh
          bash -n tools/nexium_driving_probe.sh
          python3 tests/test_nexium_driving_live.py
          python3 tests/test_nexium_driving_raster.py
          python3 tests/test_nexium_driving_blackout.py
          python3 tests/test_nexium_road_review.py
          python3 tests/test_nexium_road_x11_shape.py
          python3 tests/test_nexium_road_x11_sweep.py
          python3 tests/test_nexium_private_road_sd.py
          python3 tests/test_nexium_private_road_r3.py
          python3 tests/test_nexium_road_reject.py
          bash -n tools/nexium_private_road_reject_probe.sh
          python3 tests/test_nexium_hd_fx_guest.py
          python3 tests/test_nexium_hd_fx_combat.py
          python3 tests/test_nexium_hd_fx_sentry.py
          python3 tests/test_nexium_hd_fx_sentry_hit.py
          python3 tests/test_nexium_sentry_hero_impact.py
          python3 tests/test_nexium_sentry_hero_recovery.py
          python3 tests/test_nexium_hd_low_health.py
          python3 tests/test_nexium_hd_low_health_lifecycle.py
          python3 tests/test_nexium_guard_cooldown_x11.py
          python3 tests/test_nexium_guard_ready_x11.py
          python3 tests/test_verify_nexium_release.py
          python3 tests/test_nexium_witness_audit.py
      - name: Install NeXium, launch graphical NRO and check real guest record
        run: bash tools/run_nexium_vice_ci.sh emulator-input/vpd_native_scene.nro emulator-evidence
      - name: Save emulator logs, guest output and diagnostics even if blocked
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vice-nexium-runtime-evidence
          path: |
            emulator-evidence/*.txt
            emulator-evidence/driving-run/**
            emulator-evidence/*.log
            emulator-evidence/xdg-config/NeXium/logs/*.log
            emulator-evidence/vulkan.txt
