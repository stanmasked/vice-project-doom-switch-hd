name: Nintendo Switch graphical scene
on:
  push:
    paths:
      - 'graphics_core/**'
      - 'game_core/**'
      - 'switch_graphical/**'
      - 'tests/test_scene_renderer.cpp'
      - 'tests/test_impact_lighting.cpp'
      - 'tests/test_hd_hit_light_witness.cpp'
      - 'tests/test_hd_footstep_witness.cpp'
      - 'tests/test_graphics_integration.cpp'
      - 'tests/test_asset_atlas.cpp'
      - 'tests/test_vpat_packer.py'
      - 'tests/test_terrain_generator.py'
      - 'tools/build_demo_atlas.py'
      - 'tools/build_demo_terrain.py'
      - 'tools/build_demo_backdrop.py'
      - 'tools/build_demo_decor.py'
      - 'tools/pack_decor_layout.py'
      - 'assets/demo_decor_layout.json'
      - 'tests/test_decor_layout.cpp'
      - 'tests/test_decor_layout_packer.py'
      - 'tests/test_decor_source.cpp'
      - 'tests/test_decor_generator.py'
      - 'tests/test_backdrop_source.cpp'
      - 'tests/test_backdrop_generator.py'
      - 'tests/test_terrain_source.cpp'
      - 'tools/pack_vpat.py'
      - 'tools/build_animation_manifest.py'
      - 'assets/demo_animation.json'
      - 'tests/test_animation.cpp'
      - 'tests/test_animation_manifest.py'
      - 'tools/pack_animation_binary.py'
      - 'tests/test_animation_binary.py'
      - 'tests/test_animation_identity.py'
      - 'tests/test_asset_bundle.cpp'
      - 'tests/test_graphics_animation_integration.cpp'
      - 'tests/check_nro.py'
      - '.github/workflows/native-graphics.yml'
  pull_request:
    paths:
      - 'graphics_core/**'
      - 'game_core/**'
      - 'switch_graphical/**'
      - 'tests/test_scene_renderer.cpp'
      - 'tests/test_impact_lighting.cpp'
      - 'tests/test_hd_hit_light_witness.cpp'
      - 'tests/test_hd_footstep_witness.cpp'
      - 'tests/test_graphics_integration.cpp'
      - 'tests/test_asset_atlas.cpp'
      - 'tests/test_vpat_packer.py'
      - 'tools/build_demo_atlas.py'
      - 'tools/pack_vpat.py'
      - 'tools/build_demo_terrain.py'
      - 'tools/build_demo_backdrop.py'
      - 'tests/test_terrain_generator.py'
      - 'tests/test_backdrop_generator.py'
      - 'tests/test_terrain_source.cpp'
      - 'tests/test_backdrop_source.cpp'
      - 'tools/build_animation_manifest.py'
      - 'assets/demo_animation.json'
      - 'tests/test_animation.cpp'
      - 'tests/test_animation_manifest.py'
      - 'tools/pack_animation_binary.py'
      - 'tests/test_animation_binary.py'
      - 'tests/test_animation_identity.py'
      - 'tests/test_asset_bundle.cpp'
      - 'tests/test_graphics_animation_integration.cpp'
      - 'tests/check_nro.py'
      - '.github/workflows/native-graphics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-raster-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure graphics core
        run: cmake -S graphics_core -B build/graphics_core -DCMAKE_BUILD_TYPE=Release
      - name: Build graphics test
        run: cmake --build build/graphics_core --parallel 2
      - name: Test renderer
        run: ctest --test-dir build/graphics_core --output-on-failure
      - name: Record synthetic scene fingerprint
        run: build/graphics_core/vpd_scene_renderer_test
  build-switch-nro:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build ROM-free native raster scene
        shell: bash
        run: |
          set -euxo pipefail
          export DEVKITPRO=/opt/devkitpro
          export DEVKITA64=$DEVKITPRO/devkitA64
          export PATH="$DEVKITA64/bin:$DEVKITPRO/tools/bin:$PATH"
          make -C switch_graphical clean all
          python3 tests/check_nro.py switch_graphical/vpd_native_scene.nro
      - name: Publish graphical NRO diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: vpd-native-raster-scene
          path: switch_graphical/vpd_native_scene.nro
          if-no-files-found: error
